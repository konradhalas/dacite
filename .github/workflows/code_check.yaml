name: Code Check

on:
  workflow_call:
    inputs:
      publish_performance:
        required: true
        type: boolean
      store_benchmark:
        required: true
        type: boolean

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15', '3.14t' ]

    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Testing Check
        run: pytest --cov=dacite
      - name: Formatting Check
        run: black --check .
      - name: Typing Check
        run: mypy dacite
      - name: Linting Check
        run: pylint dacite
      - name: Performance Check
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          save-data-file: ${{ inputs.store_benchmark }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ inputs.publish_performance }}
          benchmark-data-dir-path: performance/${{ matrix.python-version }}
          comment-always: false
          alert-threshold: '130%'
          comment-on-alert: true
          fail-on-alert: false

  package:
    # The wheel is pure Python (py3-none-any): build it once per OS, check the metadata and run a smoke test against
    # the *installed* wheel from outside the repository (catches modules missing from the package).
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    name: Package (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist .
          python -m twine check dist/*
      - name: Smoke test the installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then PY="$RUNNER_TEMP/smoke/Scripts/python"; else PY="$RUNNER_TEMP/smoke/bin/python"; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" "$GITHUB_WORKSPACE/.github/smoke_test.py"
